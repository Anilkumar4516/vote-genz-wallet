user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstreams for Microservices
    upstream auth_backend {
        server auth-service:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream voting_backend {
        server voting-service:3002 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream admin_backend {
        server admin-service:3003 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream face_backend {
        server face-service:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream web_frontend {
        server web:3000;
    }

    upstream admin_frontend {
        server admin-web:3004;
    }

    # Include modular rate-limiting and server blocks
    include /etc/nginx/conf.d/*.conf;
}
