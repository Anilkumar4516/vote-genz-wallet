# ====================================================================
# Rate Limiting Configuration & Zones
# Protects authentication and ballot casting endpoints from brute-force & DDoS
# ====================================================================

# Zone 1: Strict rate limiting for OTP verification and login (5 requests / second)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Zone 2: Fast burst rate limiting for vote token and casting (25 requests / second)
limit_req_zone $binary_remote_addr zone=vote_limit:20m rate=25r/s;

# Zone 3: Biometric image upload endpoint limit (2 requests / second per IP)
limit_req_zone $binary_remote_addr zone=face_limit:10m rate=2r/s;

# Custom 429 JSON response
limit_req_status 429;
