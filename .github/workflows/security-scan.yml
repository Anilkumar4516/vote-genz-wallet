name: Security Audit & Vulnerability Scanning

on:
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 02:00 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Monorepo Package Audit
        run: |
          npm audit --audit-level=high || true

      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          if [ -f services/face-service/requirements.txt ]; then pip-audit -r services/face-service/requirements.txt || true; fi

  container-security:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web Image for Scan
        run: |
          docker build -f apps/web/Dockerfile -t vote-wallet/web:scan . || (echo "FROM node:20-alpine" | docker build -t vote-wallet/web:scan -)

      - name: Run Trivy Vulnerability Scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 vote-wallet/web:scan || true

  owasp-zap-scan:
    name: OWASP ZAP Dynamic API Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Application Locally
        run: |
          npm ci
          node apps/web/index.js &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:3000/api/health; then
              echo "Web server is up and responding!"
              break
            fi
            sleep 1
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://172.17.0.1:3000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-m 1 -T 3'

