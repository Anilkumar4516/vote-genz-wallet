# ====================================================================
# Vote Wallet: Production Kubernetes Architecture (1M Users Scale)
# Includes: Namespace, ConfigMap, Secrets, PostgreSQL, Redis,
# API Deployment (HPA 3-20 pods), Worker Deployment (HPA 2-10 pods),
# PodDisruptionBudgets, and Ingress with Rate Limiting.
# ====================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: vote-wallet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vote-config
  namespace: vote-wallet
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  VOTE_STREAM_KEY: "election:1:ballot_stream"
  VOTE_CONSUMER_GROUP: "voting_workers"
  VOTE_BATCH_SIZE: "100"
  PGHOST: "postgres-service"
  PGPORT: "5432"
  PGDATABASE: "vote_wallet"
  PGUSER: "postgres"
  PG_MAX_CONNECTIONS: "50"
---
apiVersion: v1
kind: Secret
metadata:
  name: vote-secrets
  namespace: vote-wallet
type: Opaque
stringData:
  PGPASSWORD: "prod_secure_pg_password_change_me"
  ELECTION_SECRET: "prod_vault_master_key_999824_super_secure"
  DATABASE_URL: "postgres://postgres:prod_secure_pg_password_change_me@postgres-service:5432/vote_wallet"
---
# PostgreSQL StatefulSet & Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vote-wallet
spec:
  ports:
    - port: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vote-wallet
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: vote-secrets
            - configMapRef:
                name: vote-config
          env:
            - name: POSTGRES_DB
              value: "vote_wallet"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vote-secrets
                  key: PGPASSWORD
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
# Redis Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vote-wallet
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vote-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
# Web API Deployment & Horizontal Pod Autoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-api
  namespace: vote-wallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vote-api
  template:
    metadata:
      labels:
        app: vote-api
    spec:
      containers:
        - name: api
          image: vote-wallet-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: vote-config
            - secretRef:
                name: vote-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote-api-hpa
  namespace: vote-wallet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vote-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vote-api-pdb
  namespace: vote-wallet
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vote-api
---
apiVersion: v1
kind: Service
metadata:
  name: vote-api-service
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: vote-api
---
# Asynchronous Voting Worker Deployment & Autoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-worker
  namespace: vote-wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-worker
  template:
    metadata:
      labels:
        app: vote-worker
    spec:
      containers:
        - name: worker
          image: vote-wallet-api:latest
          command: ["node", "../../services/worker.js"]
          envFrom:
            - configMapRef:
                name: vote-config
            - secretRef:
                name: vote-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote-worker-hpa
  namespace: vote-wallet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vote-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# Ingress Controller Configuration (NGINX Ingress)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-ingress
  namespace: vote-wallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  rules:
    - host: vote.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote-api-service
                port:
                  number: 80
