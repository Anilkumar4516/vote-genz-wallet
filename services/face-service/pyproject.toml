[project]
name = "vote-wallet-face-service"
version = "1.0.0"
description = "FastAPI biometric face verification and liveness microservice with InsightFace ArcFace matching and memory-only template decryption"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "numpy>=1.26.0",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
