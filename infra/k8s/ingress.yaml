# ====================================================================
# Vote Wallet: Production Ingress (Cert-Manager + TLS)
# ====================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-wallet-ingress
  namespace: vote-wallet
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  tls:
    - hosts:
        - vote.gov.in
        - admin.vote.gov.in
      secretName: vote-wallet-tls-cert
  rules:
    - host: vote.gov.in
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api/voting
            pathType: Prefix
            backend:
              service:
                name: voting-service
                port:
                  number: 3002
          - path: /api/face
            pathType: Prefix
            backend:
              service:
                name: face-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 3000
    - host: admin.vote.gov.in
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 3003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 3004
