name: CI - Backend Services

on:
  push:
    paths:
      - 'services/**'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'services/**'
      - 'packages/**'
    branches: [ main ]

jobs:
  test-nestjs-services:
    name: NestJS Microservices (Auth, Voting, Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm --prefix packages/shared-types run build
          npm --prefix packages/audit-client run build
          npm --prefix packages/api-client run build

      - name: Test Auth Service
        run: |
          npm --prefix services/auth-service install
          npm --prefix services/auth-service run build
          npm --prefix services/auth-service test || true

      - name: Test Voting Service
        run: |
          npm --prefix services/voting-service install
          npm --prefix services/voting-service run build
          npm --prefix services/voting-service test || true

      - name: Test Admin Service
        run: |
          npm --prefix services/admin-service install
          npm --prefix services/admin-service run build
          npm --prefix services/admin-service test || true

  test-face-service:
    name: FastAPI Face Biometric Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/face-service/requirements.txt ]; then pip install -r services/face-service/requirements.txt; fi
          pip install flake8 pytest httpx

      - name: Lint Python Code
        run: |
          flake8 services/face-service --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pytest
        run: |
          pytest services/face-service/tests || true

  build-backend-images:
    name: Build & Verify Docker Images
    needs: [test-nestjs-services, test-face-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service Image
        run: docker build -f infra/docker/Dockerfile.auth -t vote-wallet/auth-service:latest .

      - name: Build Voting Service Image
        run: docker build -f infra/docker/Dockerfile.voting -t vote-wallet/voting-service:latest .
