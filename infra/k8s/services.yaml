# ====================================================================
# Vote Wallet: Internal Cluster Services
# ====================================================================

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: voting-service
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      name: http
  selector:
    app: voting-service
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
      name: http
  selector:
    app: admin-service
---
apiVersion: v1
kind: Service
metadata:
  name: face-service
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: face-service
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: web-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: vote-wallet
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
      name: http
  selector:
    app: admin-frontend
