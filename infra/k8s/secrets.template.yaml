# ====================================================================
# Secrets Template for Vote Wallet Kubernetes Cluster
# DO NOT COMMIT ACTUAL PRODUCTION PASSWORDS OR HSM KEYS TO GIT
# Use SealedSecrets, Vault, or AWS Secrets Manager Operator in Production
# ====================================================================

apiVersion: v1
kind: Secret
metadata:
  name: vote-wallet-secrets
  namespace: vote-wallet
type: Opaque
stringData:
  # Database 1: Voter Identity Registry Database
  VOTER_REGISTRY_DB_USER: "voter_registry_user"
  VOTER_REGISTRY_DB_PASS: "REPLACE_WITH_STRONG_REGISTRY_PASSWORD"
  VOTER_REGISTRY_DATABASE_URL: "postgres://voter_registry_user:REPLACE_WITH_STRONG_REGISTRY_PASSWORD@voter-registry-db:5432/vote_wallet_identity"

  # Database 2: Encrypted Ballot Box Database
  BALLOT_BOX_DB_USER: "ballot_box_user"
  BALLOT_BOX_DB_PASS: "REPLACE_WITH_STRONG_BALLOT_PASSWORD"
  BALLOT_BOX_DATABASE_URL: "postgres://ballot_box_user:REPLACE_WITH_STRONG_BALLOT_PASSWORD@ballot-box-db:5432/vote_wallet_ballot_box"

  # Redis Cluster
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_AUTH_PASSWORD"

  # Cryptography Secrets
  JWT_SECRET: "REPLACE_WITH_256BIT_RANDOM_HMAC_SECRET"
  BALLOT_ENCRYPTION_MASTER_KEY: "REPLACE_WITH_32BYTE_HEX_ENCRYPTION_KEY"
  AUDIT_LOG_SALT: "REPLACE_WITH_64BYTE_HASH_SALT"

  # External SMS & MFA Gateway
  SMS_GATEWAY_API_KEY: "REPLACE_WITH_MSG91_OR_TWILIO_API_KEY"
  TOTP_ENCRYPTION_KEY: "REPLACE_WITH_TOTP_VAULT_KEY"
