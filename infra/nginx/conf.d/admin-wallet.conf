# ====================================================================
# Election Commission Admin & Auditor Management Gateway
# Strict Mutual TLS / IP Restricted Management Console
# ====================================================================

server {
    listen 8443 ssl http2;
    server_name admin.vote.gov.in;

    ssl_certificate /etc/nginx/certs/admin_wallet.crt;
    ssl_certificate_key /etc/nginx/certs/admin_wallet.key;

    # Admin Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Admin Frontend (Next.js Dashboard)
    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservice: Admin Service (:3003)
    location /api/admin/ {
        client_max_body_size 25M; # Allows bulk voter CSV and photo imports
        proxy_pass http://admin_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
