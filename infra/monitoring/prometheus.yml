global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'voting-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['voting-service:3002']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'admin-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['admin-service:3003']

  - job_name: 'face-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['face-service:8000']
